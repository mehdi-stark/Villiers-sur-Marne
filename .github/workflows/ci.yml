name: CI
on: [push, pull_request]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (core + 3 apps)
        run: pnpm -r typecheck
      - name: Tests (core + cockpit)
        run: pnpm -r test
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - name: Schéma ↔ migrations en phase (une migration manquante = échec)
        run: |
          pnpm --filter @ville/core db:check
          pnpm --filter @ville/core db:generate
          if [ -n "$(git status --porcelain packages/core/db/migrations)" ]; then echo "::error::packages/core/db/schema.ts a divergé des migrations — lancer pnpm db:generate et committer"; git status --porcelain packages/core/db/migrations; exit 1; fi
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - name: Build (3 apps)
        run: pnpm -r build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          AUTH_SECRET: "ci-secret-non-utilise"
          FAMILLE_AUTH_SECRET: "ci-secret-non-utilise"
          AGENTS_AUTH_SECRET: "ci-secret-non-utilise"
          ADMIN_EMAILS: "ci@example.invalid"
          AGENT_EMAILS: "ci@example.invalid"
