name: CI
on: [push, pull_request]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Schéma ↔ migrations en phase (une migration manquante = échec)
        run: |
          pnpm db:check
          pnpm db:generate
          if [ -n "$(git status --porcelain db/migrations)" ]; then echo "::error::db/schema.ts a divergé des migrations — lancer pnpm db:generate et committer"; git status --porcelain db/migrations; exit 1; fi
        env: { DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci" }
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          AUTH_SECRET: "ci-secret-non-utilise"
          ADMIN_EMAILS: "ci@example.invalid"
